<!DOCTYPE html>
<html>

<head>
  <title>Pathfinder</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <h1>Pathfinder</h1>

  <div class="toolbar">
    <div class="tool-group">
      <span class="label">Draw</span>
      <button id="wallButton" class="tool active">Wall</button>
      <button id="startButton" class="tool">Start</button>
      <button id="endButton" class="tool">End</button>
    </div>

    <div class="tool-group">
      <button class="label" id="weightModeButton">Weight Mode</button>
      <select id="weightSelector" style="display:none" class="tool">Weight</button>
        <option value=1>1</option>
        <option value=2>2</option>
        <option value=3>3</option>
        <option value=4>4</option>
        <option value=5>5</option>
      </select>
    </div>

    <div class="tool-group">
      <span class="label">Algorithm</span>
      <select id="algorithmSelect">
        <option value="bfs">BFS</option>
        <option value="dfs">DFS</option>
        <option value="dijkstra">Dijkstra</option>
        <option value="astar">A*</option>
      </select>
      <button id="RunButton">Run</button>
    </div>

    <div class="tool-group">
      <span class="label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="100" value="50">
    </div>

    <div class="tool-group">
      <button id="resetButton" class="danger">Reset</button>
    </div>
  </div>

  <canvas id="grid"></canvas>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
